# This spack.yaml file simply configures the Fenix repository's github packages
# as a binary package buildcache. Used by the CI to save built dependencies.
spack:
  view: /opt/view
  
  config:
    install_tree:
      root: /opt/spack
      padded_length: 128

  packages:
    all:
      require: 'target=x86_64_v3'

  mirrors:
    fenix-buildcache:
      url: oci://ghcr.io/sandialabs/fenix
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
